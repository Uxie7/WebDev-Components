<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .popup{
            display: none;
            position:fixed;
            backdrop-filter: blur(5px);

            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            
            justify-content: center;
            align-items: center;
            z-index:1000;

            transition: all 0.3 ease;

        }
        .popup-content {
            position: relative;
            background: rgb(223, 149, 179);
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        .close{
            position:absolute;
            top:10px;
            right:15px;
            font-size:20px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="btn">
        <button onclick="openPopUp()">🥳</button>
    </div>
    <div id="PopUp" class="popup">
        <div class="popup-content">
            <span class="close" onclick="closePopUp()">✖</span> <!--🆇✘☒Ⓧ🅧🅇X-->
            <h2>Surprise! 🎉</h2>
        </div>
    </div>
    <script>
        function openPopUp(){
            document.getElementById("PopUp").style.display="flex";
        }
        function closePopUp(){
            document.getElementById("PopUp").style.display="none";
        }
    </script>
</body>
</html>
