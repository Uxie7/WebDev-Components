<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Calendar</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }
    .calendar {
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      padding: 20px;
      border-radius: 10px;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .month-display {
      font-size: 20px;
      cursor: default;
    }
    .year-display {
      cursor: pointer;
      text-decoration: underline;
    }
    .arrow {
      font-size: 22px;
      cursor: pointer;
      padding: 0 10px;
      user-select: none;
    }
    .days, .dates {
      display: grid;
      grid-template-columns: repeat(7, 40px);
      gap: 5px;
      text-align: center;
    }
    .days div, .dates div {
      padding: 8px;
      border-radius: 5px;
    }
    .days div {
      font-weight: bold;
    }
    .dates div:hover {
      background-color: #eee;
      cursor: pointer;
    }
    .selected {
      background-color: #2196F3;
      color: white;
    }
    select#yearSelect {
      margin-top: 5px;
    }
  </style>
</head>
<body>

<div class="calendar">
  <div class="calendar-header">
    <div class="arrow" id="prev">&#8592;</div>
    <div class="month-display">
      <span id="monthName"></span> <span id="yearDisplay" class="year-display"></span>
      <select id="yearSelect" style="display:none;"></select>
    </div>
    <div class="arrow" id="next">&#8594;</div>
  </div>

  <div class="days">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>
  <div class="dates" id="datesGrid"></div>

  <p id="selectedDate" style="text-align:center; margin-top:10px;"></p>
</div>

<script>
  const monthNames = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
  ];

  let currentDate = new Date();
  let selectedDay = null;

  const monthNameEl = document.getElementById('monthName');
  const yearDisplayEl = document.getElementById('yearDisplay');
  const yearSelectEl = document.getElementById('yearSelect');
  const datesGrid = document.getElementById('datesGrid');
  const selectedDateEl = document.getElementById('selectedDate');

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    monthNameEl.textContent = monthNames[month];
    yearDisplayEl.textContent = year;

    datesGrid.innerHTML = "";

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    // Padding for empty boxes before start
    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      datesGrid.appendChild(empty);
    }

    for (let i = 1; i <= daysInMonth; i++) {
      const date = document.createElement('div');
      date.textContent = i;

      // Highlight selected
      if (selectedDay && selectedDay.getFullYear() === year &&
          selectedDay.getMonth() === month && selectedDay.getDate() === i) {
        date.classList.add("selected");
      }

      date.addEventListener('click', () => {
        selectedDay = new Date(year, month, i);
        selectedDateEl.textContent = `Selected Date: ${i}-${month + 1}-${year}`;
        renderCalendar(); // re-render to highlight
      });

      datesGrid.appendChild(date);
    }
  }

  document.getElementById("prev").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById("next").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  // Show year dropdown
  yearDisplayEl.addEventListener("click", () => {
    const currentYear = currentDate.getFullYear();
    yearSelectEl.innerHTML = "";

    for (let y = currentYear - 50; y <= currentYear + 20; y++) {
      const option = document.createElement("option");
      option.value = y;
      option.text = y;
      if (y === currentYear) option.selected = true;
      yearSelectEl.appendChild(option);
    }

    yearSelectEl.style.display = "inline";
    yearDisplayEl.style.display = "none";
  });

  // Update year from dropdown
  yearSelectEl.addEventListener("change", () => {
    const newYear = parseInt(yearSelectEl.value);
    currentDate.setFullYear(newYear);
    yearSelectEl.style.display = "none";
    yearDisplayEl.style.display = "inline";
    renderCalendar();
  });

  renderCalendar();
</script>

</body>
</html>
